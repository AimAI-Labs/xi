name: Publish to npm

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: '发布版本号（如 0.1.0，留空则自动使用 package.json 现有版本）'
        required: false
        default: ''

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Upgrade npm to latest for Trusted Publishing
        run: npm install -g npm@latest

      - name: Sync version
        run: |
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            VERSION=${GITHUB_REF_NAME#v}
            echo "Setting package.json version from git tag to $VERSION"
            npm version "$VERSION" --no-git-tag-version --allow-same-version
          elif [[ -n "${{ inputs.version }}" ]]; then
            INPUT_VER="${{ inputs.version }}"
            VERSION=${INPUT_VER#v}
            echo "Setting package.json version from manual input to $VERSION"
            npm version "$VERSION" --no-git-tag-version --allow-same-version
          else
            CURRENT_VER=$(node -p "require('./package.json').version")
            echo "No tag or version input detected. Using current package.json version: $CURRENT_VER"
          fi

      - name: Run test suite
        run: npm test

      - name: Build production bundle
        run: npm run build

      - name: Publish to npm
        run: npm publish --access public --provenance

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
